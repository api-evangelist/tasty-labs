name: Tasty Labs
description: >-
  Tasty Labs, Inc. was a social-software development studio founded in 2010 by Joshua Schachter
  (creator of Delicious), Nick Nguyen, and Paul Rademacher. Backed by a $3M Series A from Union
  Square Ventures and Andreessen Horowitz (a16z), it built experimental consumer products including
  Jig.com (a marketplace for needs), Human.io (a micro-task service), and Skills.to. The company
  was acquired by @WalmartLabs in May 2013, with its team and technology folded into WalmartLabs;
  the tastylabs.com domain no longer resolves. This profile is retained as a historical portfolio
  record and exposes no public API surface, developer documentation, or specifications.
